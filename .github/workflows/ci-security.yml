name: CI Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/

  secret-scan:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks (full filesystem scan)
        run: gitleaks detect --source . --no-git -c .gitleaks.toml --redact -v

  dependency-scan:
    name: Trivy (dependency + image scanning)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t devsecops-demo:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-demo:ci
          format: table
          exit-code: '1'          # fails the job if vulnerabilities are found
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          
  aws-oidc-verify:
    name: AWS OIDC - Verify Passwordless Auth
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for requesting the OIDC JWT
      contents: read
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify identity (no long-lived keys used)
        run: aws sts get-caller-identity
