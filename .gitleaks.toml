title = "Custom Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "hardcoded-secret-assignment"
description = "Catches secret/key/password/token variables assigned a plain string literal, regardless of entropy"
regex = '''(?i)(secret_key|api_key|apikey|password|passwd|secret|token)['"]?\]?\s*=\s*['"][a-zA-Z0-9_\-]{6,}['"]'''
tags = ["custom", "hardcoded-secret"]

[rules.allowlist]
regexes = [
  '''os\.environ''',
  '''os\.getenv''',
]

[allowlist]
paths = [
  '''SECURITY\.md''',
]
